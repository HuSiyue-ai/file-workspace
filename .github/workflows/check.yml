name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test-only PDF dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and check
        shell: pwsh
        run: |
          $env:FILE_WORKSPACE_PDF_PYTHON = (Get-Command python).Source
          python build.py
          python check.py --require-pdf
