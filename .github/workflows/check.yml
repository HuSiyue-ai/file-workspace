name: Checks and Linux preview release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test-only PDF dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and check
        shell: pwsh
        run: |
          $env:FILE_WORKSPACE_PDF_PYTHON = (Get-Command python).Source
          python verify_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python check.py --require-pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: linux-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Package and publish a new Linux preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-linux\.[0-9]+$ ]] || exit 0
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "docs/releases/$version.md"
            echo "Updated release notes for $tag; tag and assets unchanged."
            exit 0
          fi
          python package_release.py
          gh release create "$tag" \
            "dist/file-workspace-$version-linux-source.tar.gz" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "file-workspace $tag — Linux / SSH preview" \
            --notes-file "docs/releases/$version.md" \
            --prerelease --latest=false
